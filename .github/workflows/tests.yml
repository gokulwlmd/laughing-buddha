name: Tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_repository_hygiene.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
  test:
    name: Backend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/stripe-v2-checkout/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/stripe-v2-checkout/qa/package-lock.json
      - run: python -m pip install -r tools/stripe-v2-checkout/requirements-dev.txt
      - run: npm --prefix tools/stripe-v2-checkout/qa ci --ignore-scripts
      - run: tools/stripe-v2-checkout/qa/node_modules/.bin/playwright install --with-deps chromium
      - run: python tools/stripe-v2-checkout/qa/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: tools/stripe-v2-checkout/qa/results
          retention-days: 7
