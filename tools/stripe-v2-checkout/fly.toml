app = "wlmd-stripe-test-0f89b1bb"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  CHECKOUT_PUBLIC_URL = "https://wlmd-stripe-test-0f89b1bb.fly.dev"
  CHECKOUT_STATE_DIR = "/data"
  CHECKOUT_AUTHORIZATION_VERIFIED = "1"
  SITE_API_MANIFEST = "/data/site-api-publications.json"
  SITE_API_ALLOWED_ORIGINS = "*"
  MEMBER_IDENTITY_PROVIDER = "sticky"

[[mounts]]
  source = "checkout_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1024mb"
