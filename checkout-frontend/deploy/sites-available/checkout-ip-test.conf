# OPTIONAL — testing by server IP before DNS is ready.
# Open http://SERVER_IP/?site=checkout.mastertherapy.example (any file in sites/).
# Remove this file once real domains work. If another site already uses
# "default_server", change "listen 80 default_server" to e.g. "listen 8080".
server {
    listen 80 default_server;
    server_name _;
    include /home/geckos/NGINX_CONF/snippets/unified_checkout.conf;
    error_log /var/log/nginx/checkout-ip-test-error.log;
}
