# Shared config for every checkout domain (same idea as unified_member.conf).
# Each domain's server block just includes this file.
#
# Build location: unzip wlmd-checkout-build.zip here.
root /var/www/html/checkout;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 512;

# The domain picks its config: /config.json -> sites/<domain>.json
# e.g. checkout.mastertherapy.com -> sites/checkout.mastertherapy.com.json
location = /config.json {
    default_type application/json;
    expires epoch;
    try_files /sites/$host.json =404;
}

# Per-domain config files (also used by ?site=<domain> when testing by server IP).
location /sites/ {
    expires epoch;
    try_files $uri =404;
}

# Built JS/CSS have content hashes in their names: cache for a year.
location /assets/ {
    expires max;
    try_files $uri =404;
}

location /logos/ {
    expires 1h;
    try_files $uri =404;
}

# App page: always revalidated so a new build shows immediately. Other paths: 404.
location / {
    expires -1;
    try_files $uri $uri/ =404;
}
